name: Publish npm package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        working-directory: frontend
        # --legacy-peer-deps: vaul 0.9.x declares a react <=18 peer but works
        # with the project's react 19. Remove once vaul is bumped to >=1.1.
        run: npm install --legacy-peer-deps

      - name: Build package
        working-directory: frontend
        run: npm run build

      - name: Publish to GitHub Packages
        working-directory: frontend
        env:
          # Publish to the th30d4y GitHub Packages npm registry using the
          # built-in GITHUB_TOKEN (packages: write above). No external npm
          # secret needed. Provenance is dropped: npm --provenance is only
          # supported when publishing to the public npm registry.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish