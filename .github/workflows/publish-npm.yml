name: Publish npm package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: frontend
        # --legacy-peer-deps: vaul 0.9.x declares a react <=18 peer but works
        # with the project's react 19. Remove once vaul is bumped to >=1.1.
        run: npm install --legacy-peer-deps

      - name: Build package
        working-directory: frontend
        run: npm run build

      - name: Publish to npm
        working-directory: frontend
        run: npm publish --access public --provenance